<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Thanks | Joshua Sharman</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root { --cream: #FAF8F5; --ink: #1A1714; --gold: #C9A96E; --white: #FFFFFF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif; background: var(--cream); color: var(--ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 40px 20px;
}
h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 20px; }
a.btn { display: inline-block; padding: 13px 26px; background: var(--ink); color: var(--white); text-decoration: none; border-radius: 2px; font-size: 0.9rem; font-weight: 500; transition: background 0.2s ease; }
a.btn:hover { background: var(--gold); color: var(--ink); }
</style>
</head>
<body>
  <div>
    <h1>Thanks. I'll be in touch.</h1>
    <a class="btn" href="/contact">&larr; Back</a>
  </div>
</body>
</html>
